server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Traefik e a borda TLS; confia no IP real repassado
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------------------------------------------------------------------
    # URLs limpas: /pagina.html responde 301 para /pagina, e /index.html
    # para /. Um unico endereco canonico por pagina, sem conteudo duplicado.
    #
    # A condicao testa $request_uri (a URI original do cliente), nunca $uri.
    # Isso e o que evita loop: o try_files abaixo reescreve internamente
    # /pagina -> /pagina.html, mas $request_uri continua sendo /pagina, entao
    # a regra nao dispara de novo.
    # ---------------------------------------------------------------------
    if ($request_uri ~ ^/index\.html(\?|$)) {
        return 301 /$is_args$args;
    }
    if ($request_uri ~ ^/(.+)\.html(\?|$)) {
        return 301 /$1$is_args$args;
    }

    # Assets estaticos: cache longo
    location ~* \.(css|js|png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf|eot|pdf)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

    # Bloqueia arquivos que nao devem ser servidos
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(md|yml|yaml|log|bak|sql)$ { deny all; return 404; }

    # Paginas: /pagina serve pagina.html. HTML sempre revalida, para que um
    # deploy novo apareca na hora.
    location / {
        try_files $uri $uri.html $uri/ =404;

        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    error_page 404 /index.html;
}
