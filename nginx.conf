server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Traefik e a borda TLS; confia no IP real repassado
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # HTML: sempre revalida (deploy novo aparece na hora)
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Assets estaticos: cache longo
    location ~* \.(css|js|png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf|eot|pdf)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

    # Bloqueia arquivos que nao devem ser servidos
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(md|yml|yaml|log|bak|sql)$ { deny all; return 404; }

    # Aceita /pagina e /pagina.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /index.html;
}
